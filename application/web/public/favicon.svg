  <!-- gema ámbar -->
  <path d="M32 15 L45 24 L43 46 L32 52 L21 45 L20 25 Z" fill="url(#gem)" stroke="#b5740a" stroke-width="1.5" stroke-linejoin="round"/>
  <path d="M32 15 L45 24 L36 30 L28 27 Z" fill="#f6ce7e" opacity="0.55"/>

  <!-- cruz médica + ECG -->
