# Plantilla del peer de una clínica dada de alta en caliente. scripts/addOrg.sh
# la renderiza en compose/generated/compose-<key>.yaml y la levanta con docker
# compose. Mismo patrón que los peers fundadores de compose-network.yaml,
# incluido el montaje del socket de Docker para el chaincode builder legacy.
#
# Se une a la red pfi_network ya creada por compose-network.yaml (external), en
# vez de definirla: si la declarara propia, docker compose crearía una segunda
# red con otro nombre de proyecto y el peer no vería al orderer.

volumes:
  peer0.__DOMAIN__:

networks:
  pfi-network:
    name: pfi_network
    external: true

services:

  peer0.__DOMAIN__:
    container_name: peer0.__DOMAIN__
    image: hyperledger/fabric-peer:latest
    labels:
      service: hyperledger-fabric
      pfi-clinic: "__KEY__"
    environment:
      - FABRIC_CFG_PATH=/etc/hyperledger/peercfg
      - FABRIC_LOGGING_SPEC=INFO
      - CORE_PEER_TLS_ENABLED=true
      - CORE_PEER_PROFILE_ENABLED=false
      - CORE_PEER_TLS_CERT_FILE=/etc/hyperledger/fabric/tls/server.crt
      - CORE_PEER_TLS_KEY_FILE=/etc/hyperledger/fabric/tls/server.key
      - CORE_PEER_TLS_ROOTCERT_FILE=/etc/hyperledger/fabric/tls/ca.crt
      - CORE_PEER_ID=peer0.__DOMAIN__
      - CORE_PEER_ADDRESS=peer0.__DOMAIN__:__PEER_PORT__
      - CORE_PEER_LISTENADDRESS=0.0.0.0:__PEER_PORT__
      - CORE_PEER_CHAINCODEADDRESS=peer0.__DOMAIN__:__CC_PORT__
      - CORE_PEER_CHAINCODELISTENADDRESS=0.0.0.0:__CC_PORT__
      - CORE_PEER_GOSSIP_BOOTSTRAP=peer0.__DOMAIN__:__PEER_PORT__
      - CORE_PEER_GOSSIP_EXTERNALENDPOINT=peer0.__DOMAIN__:__PEER_PORT__
      - CORE_PEER_LOCALMSPID=__MSPID__
      - CORE_PEER_MSPCONFIGPATH=/etc/hyperledger/fabric/msp
      - CORE_OPERATIONS_LISTENADDRESS=peer0.__DOMAIN__:__OPS_PORT__
      - CORE_METRICS_PROVIDER=prometheus
      - CORE_CHAINCODE_EXECUTETIMEOUT=300s
      - CORE_VM_ENDPOINT=unix:///host/var/run/docker.sock
      - CORE_VM_DOCKER_HOSTCONFIG_NETWORKMODE=pfi_network
    volumes:
      - ../peercfg:/etc/hyperledger/peercfg
      - ../../organizations/peerOrganizations/__DOMAIN__/peers/peer0.__DOMAIN__:/etc/hyperledger/fabric
      - peer0.__DOMAIN__:/var/hyperledger/production
      - ${DOCKER_SOCK:-/var/run/docker.sock}:/host/var/run/docker.sock
    working_dir: /root
    command: peer node start
    ports:
      - __PEER_PORT__:__PEER_PORT__
      - __OPS_PORT__:__OPS_PORT__
    networks:
      - pfi-network
