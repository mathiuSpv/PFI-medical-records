---
################################################################################
#
#   Organizations: orderer compartido + las dos clínicas de ejemplo.
#   MSPDir apunta a las rutas generadas por cryptogen en ../organizations
#   (relativo a este archivo, que es donde configtxgen fija FABRIC_CFG_PATH).
#
################################################################################
Organizations:
  - &OrdererOrg
    Name: OrdererOrg
    ID: OrdererMSP
    MSPDir: ../organizations/ordererOrganizations/example.com/msp
    Policies:
      Readers:
        Type: Signature
        Rule: "OR('OrdererMSP.member')"
      Writers:
        Type: Signature
        Rule: "OR('OrdererMSP.member')"
      Admins:
        Type: Signature
        Rule: "OR('OrdererMSP.admin')"
    OrdererEndpoints:
      - orderer.example.com:7050

  - &ClinicaGenerica1
    Name: ClinicaGenerica1MSP
    ID: ClinicaGenerica1MSP
    MSPDir: ../organizations/peerOrganizations/generica1.example.com/msp
    Policies:
      Readers:
        Type: Signature
        Rule: "OR('ClinicaGenerica1MSP.admin', 'ClinicaGenerica1MSP.peer', 'ClinicaGenerica1MSP.client')"
      Writers:
        Type: Signature
        Rule: "OR('ClinicaGenerica1MSP.admin', 'ClinicaGenerica1MSP.client')"
      Admins:
        Type: Signature
        Rule: "OR('ClinicaGenerica1MSP.admin')"
      Endorsement:
        Type: Signature
        Rule: "OR('ClinicaGenerica1MSP.peer')"

  - &ClinicaGenerica2
    Name: ClinicaGenerica2MSP
    ID: ClinicaGenerica2MSP
    MSPDir: ../organizations/peerOrganizations/generica2.example.com/msp
    Policies:
      Readers:
        Type: Signature
        Rule: "OR('ClinicaGenerica2MSP.admin', 'ClinicaGenerica2MSP.peer', 'ClinicaGenerica2MSP.client')"
      Writers:
        Type: Signature
        Rule: "OR('ClinicaGenerica2MSP.admin', 'ClinicaGenerica2MSP.client')"
      Admins:
        Type: Signature
        Rule: "OR('ClinicaGenerica2MSP.admin')"
      Endorsement:
        Type: Signature
        Rule: "OR('ClinicaGenerica2MSP.peer')"

################################################################################
#   Capabilities
################################################################################
Capabilities:
  Channel: &ChannelCapabilities
    V2_0: true
  Orderer: &OrdererCapabilities
    V2_0: true
  Application: &ApplicationCapabilities
    V2_5: true

################################################################################
#   Application
################################################################################
Application: &ApplicationDefaults
  Organizations:
  Policies:
    Readers:
      Type: ImplicitMeta
      Rule: "ANY Readers"
    Writers:
      Type: ImplicitMeta
      Rule: "ANY Writers"
    Admins:
      Type: ImplicitMeta
      Rule: "MAJORITY Admins"
    LifecycleEndorsement:
      Type: ImplicitMeta
      Rule: "MAJORITY Endorsement"
    Endorsement:
      Type: ImplicitMeta
      Rule: "MAJORITY Endorsement"
  Capabilities:
    <<: *ApplicationCapabilities

################################################################################
#   Orderer: Raft de un solo nodo, compartido por los tres canales.
################################################################################
Orderer: &OrdererDefaults
  Addresses:
    - orderer.example.com:7050
  BatchTimeout: 2s
  BatchSize:
    MaxMessageCount: 10
    AbsoluteMaxBytes: 99 MB
    PreferredMaxBytes: 512 KB
  OrdererType: etcdraft
  EtcdRaft:
    Consenters:
      - Host: orderer.example.com
        Port: 7050
        ClientTLSCert: ../organizations/ordererOrganizations/example.com/orderers/orderer.example.com/tls/server.crt
        ServerTLSCert: ../organizations/ordererOrganizations/example.com/orderers/orderer.example.com/tls/server.crt
  Organizations:
    - *OrdererOrg
  Policies:
    Readers:
      Type: ImplicitMeta
      Rule: "ANY Readers"
    Writers:
      Type: ImplicitMeta
      Rule: "ANY Writers"
    Admins:
      Type: ImplicitMeta
      Rule: "MAJORITY Admins"
    BlockValidation:
      Type: ImplicitMeta
      Rule: "ANY Writers"
  Capabilities:
    <<: *OrdererCapabilities

################################################################################
#   Channel
################################################################################
Channel: &ChannelDefaults
  Policies:
    Readers:
      Type: ImplicitMeta
      Rule: "ANY Readers"
    Writers:
      Type: ImplicitMeta
      Rule: "ANY Writers"
    Admins:
      Type: ImplicitMeta
      Rule: "MAJORITY Admins"
  Capabilities:
    <<: *ChannelCapabilities

################################################################################
#   Profiles
#
#   Sin canal de sistema (channel participation API, como test-network desde
#   Fabric 2.3+): cada canal se crea con su propio bloque de génesis a partir
#   de un perfil. El orderer es el mismo en los tres; lo que cambia es qué
#   orgs son miembros de aplicación de cada canal.
################################################################################
Profiles:
  # Canal público: metadatos de activos (fhir_resource_id, cid, hash de paciente)
  # visibles para ambas clínicas. Nunca contiene payload clínico.
  CanalUniversal:
    <<: *ChannelDefaults
    Orderer:
      <<: *OrdererDefaults
    Application:
      <<: *ApplicationDefaults
      Organizations:
        - *ClinicaGenerica1
        - *ClinicaGenerica2

  # Canal privado de la Clínica Genérica 1: único miembro de aplicación es
  # ella misma. Sirve como bitácora interna; el orderer se comparte con el
  # resto de los canales pero Genérica 2 no es miembro de este.
  CanalGenerica1:
    <<: *ChannelDefaults
    Orderer:
      <<: *OrdererDefaults
    Application:
      <<: *ApplicationDefaults
      Organizations:
        - *ClinicaGenerica1

  # Canal privado de la Clínica Genérica 2: análogo al anterior.
  CanalGenerica2:
    <<: *ChannelDefaults
    Orderer:
      <<: *OrdererDefaults
    Application:
      <<: *ApplicationDefaults
      Organizations:
        - *ClinicaGenerica2
